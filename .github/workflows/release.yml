name: Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "release/v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Windows PowerShell package
        shell: cmd
        run: VALIDATE-PACKAGE.cmd

      - name: Validate tag and script version
        id: version
        shell: powershell
        run: |
          $source = Get-Content .\repo-backup.ps1 -Raw
          if ($source -notmatch '\$ScriptVersion\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') {
            throw "ScriptVersion not found."
          }
          $version = $Matches[1]
          $refName = "${{ github.ref_name }}"
          if ($refName -ne "v$version" -and $refName -ne "release/v$version") {
            throw "Release ref $refName does not match ScriptVersion $version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build release package
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = Join-Path $env:RUNNER_TEMP "madlabz-repo-backup-v$version"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $files = @(
            ".gitignore",
            "AUTO-BACKUP-LOG.cmd",
            "AUTO-BACKUP-SETTINGS.cmd",
            "BACKUP-NOW.cmd",
            "CHANGELOG.md",
            "DASHBOARD.cmd",
            "OPEN-STATUS-DASHBOARD.cmd",
            "REPO-BACKUP-STATUS.ps1",
            "DEMO.cmd",
            "INSTALL.cmd",
            "LICENSE",
            "ONBOARD.cmd",
            "README.md",
            "RELEASE_NOTES.md",
            "SCAN-PROJECTS.cmd",
            "STATUS.cmd",
            "TEST-AUTO-BACKUP.cmd",
            "UPDATE.cmd",
            "VALIDATE-PACKAGE.cmd",
            "VALIDATE-PACKAGE.ps1",
            "repo-backup.cmd",
            "repo-backup.ps1",
            "repos.example.json",
            "docs"
          )

          foreach ($item in $files) {
            Copy-Item $item $stage -Recurse -Force
          }

          $zip = Join-Path $PWD "madlabz-repo-backup-v$version-windows.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -Encoding ASCII

          $manifest = [ordered]@{
            schemaVersion = 1
            product = "MadLabz Repo Backup"
            version = $version
            tag = "v$version"
            platform = "windows"
            license = "MIT"
            asset = (Split-Path $zip -Leaf)
            sha256 = $hash
            releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/v$version"
            downloadUrl = "https://github.com/${{ github.repository }}/releases/download/v$version/$(Split-Path $zip -Leaf)"
          }

          $manifest | ConvertTo-Json | Set-Content "release-manifest.json" -Encoding UTF8

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $assets = @(
            "madlabz-repo-backup-v$version-windows.zip",
            "madlabz-repo-backup-v$version-windows.zip.sha256",
            "release-manifest.json"
          )
          # A release branch can publish its matching version without making
          # users create a Git tag locally. GitHub creates the tag at this
          # fully validated commit. Manual tag pushes remain supported too.
          # Windows PowerShell 5.1 turns native stderr into an error record
          # under Actions ErrorActionPreference=Stop, even with 2>$null.
          # "release not found" is expected for a first-time version.
          $savedPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = "SilentlyContinue"
            $existing = gh release view $tag --json tagName --jq .tagName 2>$null
            $existingExitCode = $LASTEXITCODE
          }
          finally {
            $ErrorActionPreference = $savedPreference
          }
          if ($existingExitCode -eq 0 -and $existing -eq $tag) {
            Write-Host "Release already exists; uploading validated assets."
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
            gh release edit $tag --title "MadLabz Repo Backup v$version" --notes-file RELEASE_NOTES.md
          }
          else {
            gh release create $tag $assets `
              --target "${{ github.sha }}" `
              --title "MadLabz Repo Backup v$version" `
              --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag." }
