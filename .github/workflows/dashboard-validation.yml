name: Windows dashboard validation

on:
  pull_request:
    paths:
      - "REPO-BACKUP-STATUS.ps1"
      - "OPEN-STATUS-DASHBOARD.cmd"
      - "repo-backup.ps1"
      - "VALIDATE-PACKAGE.ps1"
      - ".github/workflows/dashboard-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate core Windows PowerShell package
        shell: cmd
        run: VALIDATE-PACKAGE.cmd
      - name: Validate dashboard PowerShell 5.1 parse and ASCII compatibility
        shell: powershell
        run: |
          $path = Join-Path $PWD "REPO-BACKUP-STATUS.ps1"
          if (-not (Test-Path $path -PathType Leaf)) { throw "Dashboard script missing" }
          $bytes = [IO.File]::ReadAllBytes($path)
          if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) { throw "Dashboard must remain ASCII-compatible" }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            throw "Dashboard PowerShell parse failed"
          }
          if (-not (Test-Path "OPEN-STATUS-DASHBOARD.cmd")) { throw "Dashboard launcher missing" }
          Write-Host "Dashboard parse and package files: PASS"
